<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SmorX.ai Leadflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="mobile-topbar">
    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="login-brand"><span class="brand-mark"><svg viewBox="0 0 40 40" width="20" height="20"><path d="M4 30 L14 18 L21 24 L36 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="8" r="3.5" fill="currentColor"/></svg></span>SmorX.ai Leadflow</div>
    <div style="width:34px"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark"><svg viewBox="0 0 40 40" width="22" height="22"><path d="M4 30 L14 18 L21 24 L36 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="8" r="3.5" fill="currentColor"/></svg></span>
        SmorX.ai Leadflow
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="avatarInitial">?</div>
          <div>
            <div class="user-chip-name" id="userChipName">—</div>
            <div class="user-chip-role" id="userChipRole">—</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="topbar-sub" id="pageSub"></div>
        </div>
        <div id="topbarActions"></div>
      </div>
      <div class="content" id="content">
        <div class="spinner"></div>
      </div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
