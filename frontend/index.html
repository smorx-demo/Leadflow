<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SmorX.ai Leadflow — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="30" height="30">
          <path d="M4 30 L14 18 L21 24 L36 8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="36" cy="8" r="3.5" fill="currentColor"/>
        </svg>
      </div>
      <span>SmorX.ai Leadflow</span>
    </div>

    <div class="login-card">
      <h1>Sign in</h1>
      <p class="login-sub">Track your pipeline. Never miss a follow-up.</p>

      <form id="loginForm" novalidate>
        <label class="field">
          <span>Email</span>
          <input type="email" id="email" autocomplete="username" required placeholder="you@company.com">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
        </label>
        <div id="loginError" class="form-error" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign in</button>
      </form>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    (function () {
      if (Auth.getToken()) { window.location.href = 'app.html'; return; }

      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        err.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        try {
          const data = await Api.login(email, password);
          Auth.setSession(data.access_token, data.user);
          window.location.href = 'app.html';
        } catch (ex) {
          err.textContent = ex.message || 'Could not sign in. Check your email and password.';
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    })();
  </script>
</body>
</html>
