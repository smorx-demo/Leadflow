services:
  # ---------- Backend (FastAPI) ----------
  - type: web
    name: smorxai-leadflow-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard
      - key: CORS_ORIGINS
        sync: false          # set to frontend URL after deploying frontend
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"

  # ---------- Frontend (Static Site) ----------
  - type: web
    name: smorxai-leadflow-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: "."
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
